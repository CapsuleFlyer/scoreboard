# SonarQube / SonarCloud scanner configuration.
# Set the project key (and organization, for SonarCloud) before the first scan.

sonar.projectKey=CapsuleFlyer_scoreboard
sonar.organization=capsuleflyer
sonar.projectName=scoreboard
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=scripts/**